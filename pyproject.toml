[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmrsi"
version = "0.3.0.dev1"
description = "SwarmRSI: recursive self-improvement through evolving scientific agent swarms"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyflakes>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4,<5"]
openproblems = ["anndata>=0.10,<1", "scipy>=1.10,<2", "numpy>=1.24,<3"]
mlebench-insults = ["pandas>=2,<3", "scikit-learn>=1.3,<2", "PyYAML>=6,<7", "appdirs>=1.4,<2", "tqdm>=4,<5", "py7zr>=0.20,<2", "diskcache>=5,<6", "tenacity>=8,<10"]

[project.scripts]
swarmrsi = "swarmrsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["swarmrsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
